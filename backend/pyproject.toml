[tool.black]
line-length = 110

[tool.isort]
profile = "black"
line_length = 110

[tool.pytest.ini_options]
testpaths = ["unit_testing"]

[tool.coverage.run]
source = ["."]
omit = [
    "unit_testing/*",
    "alembic/*",
    "venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
